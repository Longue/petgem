name: PETGEM CI with Docker Cache

on:
  push:
    branches:
      - c-development       # Or your primary branch (e.g., master, develop)
  pull_request:
    branches:
      - c-development       # Or your primary branch

jobs:
  build_and_test_in_docker:
    runs-on: ubuntu-latest  # GitHub Actions runner type

    steps:
      # Step 1: Checkout your code
      - name: Checkout code
        uses: actions/checkout@v4
        # If you use Git submodules (e.g., Unity framework as a submodule):
        # with:
        #   submodules: 'recursive'

      # Step 2: (Optional but recommended) Set up QEMU for multi-platform builds if needed
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Step 3: Set up Docker Buildx (advanced Docker build engine)
      # Required for efficient caching with GitHub Actions Cache backend
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 4: Build the Docker image
      # This action will build the image and load it into the runner's local Docker.
      # It will also handle saving and restoring layer cache.
      - name: Build Docker image and load to local Docker
        id: docker_build # Give the step an ID to reference its outputs if needed
        uses: docker/build-push-action@v5
        with:
          context: .  # Root directory of your repo (where your Dockerfile is)
          file: ./docker/user/Dockerfile # Path to your Dockerfile (adjust if not in the root)
          # We are not pushing the image to a registry, just building and using it locally
          push: false
          # Tag for the image to reference it in subsequent steps
          tags: petgem-ci-env:latest
          # Load the built image to the runner's local Docker daemon so subsequent steps can use it
          load: true
          # Cache settings:
          # Attempt to load the cache from GitHub Actions Cache
          cache-from: type=gha
          # Save the cache to GitHub Actions Cache. 'mode=max' is more aggressive.
          cache-to: type=gha,mode=max

      # Now that the 'petgem-ci-env:latest' image is built and loaded,
      # run make commands INSIDE containers based on that image.

      # Step 5: Compile the project and tests INSIDE the Docker container
      - name: Compile project and tests (in Docker)
        run: |
          docker run --rm \
            --workdir /app \
            -v "${{ github.workspace }}":/app \
            petgem-ci-env:latest \
            make compile_tests

      # Step 6: Run tests INSIDE the Docker container
      - name: Run tests (in Docker)
        run: |
          docker run --rm \
            --workdir /app \
            -v "${{ github.workspace }}":/app \
            petgem-ci-env:latest \
            make run_tests

      # Step 7: Generate coverage report INSIDE the Docker container
      - name: Generate coverage report (in Docker)
        run: |
          docker run --rm \
            --workdir /app \
            -v "${{ github.workspace }}":/app \
            petgem-ci-env:latest \
            make coverage

      # Step 8: Upload the coverage report as a workflow artifact
      # Files generated inside the container in the mounted volume (/app)
      # will be available in ${{ github.workspace }} on the runner.
      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: petgem-coverage-report-html # Name of the artifact you'll see on GitHub
          path: build/coverage-html  # PATH TO YOUR HTML COVERAGE REPORT DIRECTORY
                                      # Ensure this path is correct
          if-no-files-found: error # Fail the step if the directory/files are not found