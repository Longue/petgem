# .readthedocs.yaml
version: 2

build:
  os: ubuntu-20.04
  tools:
    python: "3.8"
  apt_packages:
    - doxygen
    - graphviz
  jobs:
    pre_build:
      - echo "Pre build"
      - echo "Cleaning..."
      - rm -rf $READTHEDOCS_OUTPUT/html
      - rm -rf docs/doxygen
      - echo "Doxygen..."
      - doxygen Doxyfile
      - echo "Readme sync..."
      - python3 scripts/auto_doc/sync_rtd_docs.py

sphinx:
  configuration: docs/source/conf.py

python:
  install:
    - requirements: docs/requirements.txt    